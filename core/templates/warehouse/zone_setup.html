{% extends "base.html" %}
{% block title %}Zone Setup{% endblock %}
{% block header_title %}Zone Setup{% endblock %}
{% block content %}
<div class="card"><div class="card-body"><form method="post">{% csrf_token %}
<div class="form-group"><label class="form-label">Warehouse</label><select class="form-control" name="warehouse_id">{% for w in warehouses %}<option value="{{ w.id }}">{{ w.code }}</option>{% endfor %}</select></div>
<div class="form-group"><label class="form-label">Name</label><input class="form-control" name="name"></div>
<div class="form-group"><label class="form-label">Code</label><input class="form-control" name="code"></div>
<div class="form-group"><label class="form-label">Type</label><select class="form-control" name="type"><option value="bulk">Bulk</option><option value="discrete">Discrete</option></select></div>
<button class="btn btn-primary" type="submit">Save Zone</button>
</form></div></div>
{% endblock %}
