{% extends "base.html" %}
{% block title %}Create Warehouse{% endblock %}
{% block header_title %}Create Warehouse{% endblock %}
{% block content %}
<div class="card"><div class="card-body"><form method="post">{% csrf_token %}
<div class="form-group"><label class="form-label">Name</label><input class="form-control" name="name" required></div>
<div class="form-group"><label class="form-label">Code</label><input class="form-control" name="code" placeholder="W1" required></div>
<div class="form-group"><label class="form-label">Location</label><input class="form-control" name="location"></div>
<div class="form-group"><label class="form-label">Contact</label><input class="form-control" name="contact"></div>
<button class="btn btn-primary" type="submit">Save</button>
</form></div></div>
{% endblock %}
