{% extends "base.html" %}
{% block title %}Bin Configuration{% endblock %}
{% block header_title %}Bin Configuration{% endblock %}
{% block content %}
<div class="card"><div class="card-body"><form method="post">{% csrf_token %}
<div class="form-group"><label class="form-label">Rack</label><select class="form-control" name="rack_id">{% for r in racks %}<option value="{{ r.id }}">{{ r.zone.warehouse.code }}-{{ r.zone.code }}-{{ r.rack_number }}</option>{% endfor %}</select></div>
<div class="form-group"><label class="form-label">Level</label><select class="form-control" name="level_id">{% for l in levels %}<option value="{{ l.id }}">{{ l.rack.zone.warehouse.code }}-{{ l.rack.zone.code }}-{{ l.rack.rack_number }}-L{{ l.level_number }}</option>{% endfor %}</select></div>
<div class="form-group"><label class="form-label">Bins Per Level</label><input class="form-control" type="number" name="bins_per_level" value="4"></div>
<div class="form-group"><label class="form-label">Size</label><select class="form-control" name="size"><option value="S">S</option><option value="M">M</option><option value="L">L</option></select></div>
<div class="form-group"><label class="form-label">Max Capacity</label><input class="form-control" type="number" name="max_capacity" value="100"></div>
<button class="btn btn-primary" type="submit">Generate Bins</button>
</form></div></div>
{% endblock %}
