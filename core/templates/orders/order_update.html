{% extends "base.html" %}
{% block title %}Trilo WMS — Edit {{ order.order_id }}{% endblock %}
{% block header_title %}Edit order{% endblock %}

{% block content %}
  <div class="page-header">
    <div class="page-title">{{ order.order_id }}</div>
    <div class="page-subtitle">Update customer details</div>
  </div>

  <div class="card">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label" for="customer_name">Customer name</label>
          <input class="form-control" id="customer_name" name="customer_name" value="{{ order.customer_name }}" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="customer_phone">Phone</label>
          <input class="form-control" id="customer_phone" name="customer_phone" value="{{ order.customer_phone }}" />
        </div>
        <div class="form-group">
          <label class="form-label" for="delivery_address">Delivery address</label>
          <textarea class="form-control" id="delivery_address" name="delivery_address" rows="3">{{ order.delivery_address }}</textarea>
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end">
          <a class="btn btn-ghost" href="/orders/{{ order.id }}/">Cancel</a>
          <button class="btn btn-primary" type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
