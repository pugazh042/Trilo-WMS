{% extends "base.html" %}
{% block title %}Trilo WMS — Carrier Selection{% endblock %}
{% block header_title %}Carrier selection{% endblock %}

{% block content %}
  <div class="page-header">
    <div class="page-title">{{ order.order_id }}</div>
    <div class="page-subtitle">Step 1/3 · Select carrier</div>
  </div>

  <div class="card">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label" for="carrier_id">Carrier</label>
          <select class="form-control" id="carrier_id" name="carrier_id" required>
            <option value="">Select carrier</option>
            {% for c in carriers %}
              <option value="{{ c.id }}" {% if shipment.carrier_partner_id == c.id %}selected{% endif %}>
                {{ c.name }}{% if c.service_type %} ({{ c.service_type }}){% endif %}
              </option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="estimated_delivery">Estimated delivery date</label>
          <input class="form-control" id="estimated_delivery" name="estimated_delivery" type="date" value="{{ shipment.estimated_delivery|date:'Y-m-d' }}" />
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end">
          <a class="btn btn-ghost" href="/shipping/">Back</a>
          <button class="btn btn-primary" type="submit">Continue → Truck</button>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
