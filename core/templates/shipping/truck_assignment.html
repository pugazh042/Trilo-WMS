{% extends "base.html" %}
{% block title %}Trilo WMS — Truck Assignment{% endblock %}
{% block header_title %}Truck assignment{% endblock %}

{% block content %}
  <div class="page-header">
    <div class="page-title">{{ order.order_id }}</div>
    <div class="page-subtitle">Step 2/3 · Assign truck + driver + dock</div>
  </div>

  <div class="card">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label" for="truck_number">Truck number</label>
          <input class="form-control" id="truck_number" name="truck_number" value="{{ ta.truck_number }}" placeholder="e.g. TN-09-AB-1234" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="driver_name">Driver name</label>
          <input class="form-control" id="driver_name" name="driver_name" value="{{ ta.driver_name }}" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="driver_contact">Driver contact</label>
          <input class="form-control" id="driver_contact" name="driver_contact" value="{{ ta.driver_contact }}" />
        </div>
        <div class="form-group">
          <label class="form-label" for="dock_number">Dock</label>
          <input class="form-control" id="dock_number" name="dock_number" value="{{ ta.dock_number }}" placeholder="e.g. Dock-2" />
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end">
          <a class="btn btn-ghost" href="/shipping/{{ order.id }}/carrier/">Back</a>
          <button class="btn btn-primary" type="submit">Continue → Confirm</button>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
