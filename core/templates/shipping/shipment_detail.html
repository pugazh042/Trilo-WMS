{% extends "base.html" %}
{% block title %}Ship — {{ order.order_id }}{% endblock %}
{% block header_title %}Shipment{% endblock %}

{% block content %}
  <div class="page-header">
    <div class="page-title">{{ order.order_id }}</div>
    <div class="page-subtitle">Assign carrier & dispatch</div>
  </div>

  <div class="card">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label" for="carrier">Carrier</label>
          <input class="form-control" id="carrier" name="carrier" value="{{ shipment.carrier }}" placeholder="e.g. DHL" />
        </div>
        <div class="form-group">
          <label class="form-label" for="tracking_number">Tracking number</label>
          <input class="form-control" id="tracking_number" name="tracking_number" value="{{ shipment.tracking_number }}" />
        </div>
        <div class="form-group">
          <label class="form-label" for="truck_ref">Truck / route ref</label>
          <input class="form-control" id="truck_ref" name="truck_ref" value="{{ shipment.truck_ref }}" />
        </div>
        <div style="display:flex; justify-content:flex-end">
          <button class="btn btn-primary" type="submit">Mark dispatched</button>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
